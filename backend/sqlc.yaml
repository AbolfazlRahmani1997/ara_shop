version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema:
      - db/migrations/001_users.up.sql
      - db/migrations/002_catalog.up.sql
      - db/migrations/003_carts.up.sql
      - db/migrations/004_coupons.up.sql
      - db/migrations/005_orders.up.sql
      - db/migrations/006_engagement.up.sql
      - db/migrations/007_beauty.up.sql
      - db/migrations/008_admin.up.sql
    gen:
      go:
        package: sqlc
        out: internal/database/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
